[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyserval"
version = "0.1.0"
description = "TPX3 camera acquisition GUI and pipeline using the SERVAL server"
requires-python = ">=3.9"

dependencies = [
    # Core only: SERVAL.core.data_types, SERVAL.io (TPX3Run loader),
    # SERVAL.postprocessing.centroiding — file formats and offline analysis,
    # no acquisition/GUI machinery. Kept deliberately numpy-only so other
    # packages (e.g. DATpx3) can depend on pyserval for loading without
    # pulling in pyzmq/Qt/PyMoDAQ.
    "numpy",
]

[project.optional-dependencies]
# JIT-compiled packet processing (strongly recommended — ~10x faster extraction)
jit = [
    "numba",
]

# Headless live pipeline + SERVAL HTTP control, no GUI display —
# SERVAL.core.{pipeline,tcp_receiver,chunk_assembler,command_server,workers.extractor},
# SERVAL.controllers.serval_control (SERVALController is a QObject for its
# signals even when run headless, hence qtpy here rather than in "gui").
control = [
    "pyzmq",     # inter-process communication between receiver and extractors
    "requests",  # SERVAL HTTP REST client
    "qtpy",      # Qt abstraction layer — bring your own PyQt5/PyQt6/PySide6
]

# Acquisition GUI display widgets — SERVAL.gui.*, SERVAL.postprocessing.postprocessing_gui
gui = [
    "pyserval[control]",
    "pyqtgraph>=0.12",  # fast plotting widgets

    # PyMoDAQ GUI components (ParameterManager, ActionManager)
    # Install locally from ./PyMoDAQ/packages/:
    #   pip install -e PyMoDAQ/packages/pymodaq_utils
    #   pip install -e PyMoDAQ/packages/pymodaq_data
    #   pip install -e PyMoDAQ/packages/pymodaq_gui
    "pymodaq_utils",
    "pymodaq_gui",
]

# Everything for a full local install (GPU excluded). Does not pin a Qt
# backend — install whichever of PyQt5/PyQt6/PySide6 you already manage
# yourself; qtpy (pulled in by "control") picks it up automatically.
full = [
    "pyserval[jit,gui]",
]

dev = [
    "pyserval[full]",
    "pytest",
    "pytest-qt",
]

[project.scripts]
serval-gui = "SERVAL.gui.acquisition_gui:main"

[tool.hatch.build]
packages = ["SERVAL"]

[tool.hatch.build.targets.wheel]
packages = ["SERVAL"]
